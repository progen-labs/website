name: Checks

# On every pull request, every push to main and weekly: the site builds, every
# link in the Spectra docs works, and Lighthouse checks the main pages
# (accessibility, best practices and SEO must stay at 95 or more; performance
# is reported). Scores are in each run's summary, and the reports are kept.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Links between the docs pages
        run: node scripts/check-doc-links.mjs

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress README.md 'src/spectra-docs/pages/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # served from the root here, so the build drops the /website/ base
      - run: npx vite build --base / --outDir dist-lh
      - name: Lighthouse on the main pages
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Scores
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("lighthouse/manifest.json")) process.exit(0);
            const rows = JSON.parse(fs.readFileSync("lighthouse/manifest.json", "utf8")).map(r =>
              `| ${new URL(r.url).hash || "/"} | ${["performance", "accessibility", "best-practices", "seo"].map(k => Math.round((r.summary[k] ?? 0) * 100)).join(" | ")} |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              ["### Lighthouse", "", "| Page | Performance | Accessibility | Best practices | SEO |", "| --- | ---: | ---: | ---: | ---: |", ...rows, ""].join("\n"));
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse/
          if-no-files-found: ignore
